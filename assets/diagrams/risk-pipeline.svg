lvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#b2432a">review</text><rect x="20" y="200" width="1000" height="96" rx="14" fill="#ece6d6" stroke="#2a1f0c" stroke-opacity="0.25" stroke-width="1"/><text x="40" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#7a5a1e">OUTPUT</text><text x="40" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2a1f0c">About 110 requirements generated. Four curated findings written up by hand, plus a fault tree for one.</text><text x="40" y="278" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#b2432a">Human-review checkpoint between every stage. Each LLM call returns schema-constrained JSON.</text></svg>