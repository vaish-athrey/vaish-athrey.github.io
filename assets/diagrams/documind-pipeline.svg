<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a1f0c"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ec"/><text x="20" y="30" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a5a1e">INGESTION</text><rect x="20" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="95.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Legal PDF</text><text x="95.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">uploaded document</text><rect x="190" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="265.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">pdfplumber</text><text x="265.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">text, tables,</text><text x="265.0" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">layout preserved</text><rect x="360" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="435.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Clause extraction</text><text x="435.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">clause types</text><text x="435.0" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">tagged</text><rect x="530" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="605.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Chunker</text><text x="605.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">512 tokens,</text><text x="605.0" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">50-token overlap</text><rect x="700" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="775.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Embeddings</text><text x="775.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">OpenAI model</text><text x="775.0" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">per chunk</text><rect x="870" y="44" width="150" height="96" rx="12" fill="#f0b64d" stroke="#2a1f0c" stroke-width="1.6"/><text x="945.0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Pinecone</text><text x="945.0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">vector index</text><line x1="170" y1="92" x2="190" y2="92" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="340" y1="92" x2="360" y2="92" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="510" y1="92" x2="530" y2="92" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="680" y1="92" x2="700" y2="92" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="850" y1="92" x2="870" y2="92" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><text x="20" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a5a1e">QUERY</text><line x1="945" y1="140" x2="945" y2="232" stroke="#2a1f0c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="951.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#2a1f0c">index</text><polyline points="945,232 605,232 605,250" fill="none" stroke="#2a1f0c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="870" y="250" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="945.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">User question</text><text x="945.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">plain language</text><rect x="700" y="250" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="775.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Embed query</text><text x="775.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">same model as</text><text x="775.0" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">the chunks</text><rect x="530" y="250" width="150" height="96" rx="12" fill="#f0b64d" stroke="#2a1f0c" stroke-width="1.6"/><text x="605.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Top-k retrieval</text><text x="605.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">nearest chunks</text><text x="605.0" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">from Pinecone</text><rect x="360" y="250" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="435.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">LangChain chain</text><text x="435.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">retrieved text +</text><text x="435.0" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">question → LLM</text><rect x="190" y="250" width="150" height="96" rx="12" fill="#6ee7c8" stroke="#2a1f0c" stroke-width="1.6"/><text x="265.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Grounded answer</text><text x="265.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">cites the source</text><text x="265.0" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">passage</text><rect x="20" y="250" width="150" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="95.0" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Next.js UI</text><text x="95.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">reviewer view</text><line x1="870" y1="298" x2="850" y2="298" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="700" y1="298" x2="680" y2="298" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="298" x2="510" y2="298" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="360" y1="298" x2="340" y2="298" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="190" y1="298" x2="170" y2="298" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="380" width="1000" height="110" rx="14" fill="#ece6d6" stroke="#2a1f0c" stroke-opacity="0.25" stroke-width="1"/><text x="40" y="404" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#7a5a1e">CONTAINERIZED WITH DOCKER</text><text x="40" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2a1f0c">FastAPI async backend runs ingestion and query endpoints. Next.js and Tailwind frontend.</text><text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2a1f0c">One docker-compose setup brings up the whole stack, cutting setup from hours to under 5 minutes.</text></svg>