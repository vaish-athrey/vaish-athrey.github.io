<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a1f0c"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ec"/><rect x="410" y="20" width="220" height="84" rx="12" fill="#f0b64d" stroke="#2a1f0c" stroke-width="1.6"/><text x="520.0" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Zoom API</text><text x="520.0" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">live video session</text><text x="520.0" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">created on confirm</text><rect x="20" y="150" width="200" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="120.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Patient</text><text x="120.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">books and pays</text><text x="120.0" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">through the site</text><rect x="410" y="150" width="220" height="96" rx="12" fill="#b98cf2" stroke="#2a1f0c" stroke-width="1.6"/><text x="520.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Django backend</text><text x="520.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">bookings, auth,</text><text x="520.0" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">payment callbacks</text><rect x="820" y="150" width="200" height="96" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="920.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Doctor</text><text x="920.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">joins video from</text><text x="920.0" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">the booking</text><rect x="20" y="280" width="300" height="90" rx="12" fill="#f2795c" stroke="#2a1f0c" stroke-width="1.6"/><text x="170.0" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Payment gateway</text><text x="170.0" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">order confirmation</text><text x="170.0" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">and status callbacks</text><rect x="680" y="280" width="340" height="90" rx="12" fill="#6ee7c8" stroke="#2a1f0c" stroke-width="1.6"/><text x="850.0" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">MongoDB</text><text x="850.0" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">patient profiles, visits,</text><text x="850.0" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">medical test results</text><line x1="220" y1="198" x2="410" y2="198" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="198" x2="820" y2="198" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="520" y1="150" x2="520" y2="104" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><polyline points="410,240 320,280" fill="none" stroke="#2a1f0c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><line x1="630" y1="240" x2="720" y2="280" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><text x="20" y="394" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2a1f0c">Two-sided video, one backend, payments and records kept separate.</text></svg>