<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" width="1040" height="260"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a1f0c"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ec"/><rect x="20" y="60" width="180" height="110" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="110.0" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Webcam frame</text><text x="110.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">live video</text><rect x="220" y="60" width="180" height="110" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="310.0" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Grayscale + threshold</text><text x="310.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">isolate skin-tone</text><text x="310.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">regions</text><rect x="420" y="60" width="180" height="110" rx="12" fill="#ffffff" stroke="#2a1f0c" stroke-width="1.6"/><text x="510.0" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Contour segmentation</text><text x="510.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">crop the hand</text><text x="510.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">from the frame</text><rect x="620" y="60" width="180" height="110" rx="12" fill="#b98cf2" stroke="#2a1f0c" stroke-width="1.6"/><text x="710.0" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">CNN classifier</text><text x="710.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">conv, pool, dense</text><text x="710.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">26 classes</text><rect x="820" y="60" width="180" height="110" rx="12" fill="#6ee7c8" stroke="#2a1f0c" stroke-width="1.6"/><text x="910.0" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a1f0c">Speech output</text><text x="910.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">predicted letter</text><text x="910.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a1f0c">spoken aloud</text><line x1="200" y1="115" x2="220" y2="115" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="400" y1="115" x2="420" y2="115" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="600" y1="115" x2="620" y2="115" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><line x1="800" y1="115" x2="820" y2="115" stroke="#2a1f0c" stroke-width="2" marker-end="url(#ah)"/><text x="20" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2a1f0c">OpenCV does the hand isolation before the network sees anything.</text></svg>